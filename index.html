function bgDraw(){const config=portrait?backdropConfigs.tall:backdropConfigs.wide;const art=config.full.complete&&config.full.naturalWidth?config.full:config.fast;if(art.complete&&art.naturalWidth){const scale=Math.max(W/art.naturalWidth,H/art.naturalHeight),sw=W/scale,sh=H/scale;ctx.drawImage(art,(art.naturalWidth-sw)/2,(art.naturalHeight-sh)/2,sw,sh,0,0,W,H);return}const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7ab6ca');g.addColorStop(.6,'#bed9d4');g.addColorStop(1,'#e6c994');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant hills and airport terminal
 ctx.fillStyle='#688d86';ctx.beginPath();ctx.moveTo(0,H*.48);for(let i=0;i<=W;i+=W/6)ctx.lineTo(i,H*(.42+Math.sin(i/W*8)*.04));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
 const by=H*.37,bh=H*.33;ctx.fillStyle='#334e5e';ctx.fillRect(0,by,W,bh);ctx.fillStyle='#d9e6d8';ctx.fillRect(0,by+12,W,bh-22);ctx.fillStyle='#41677a';const panes=portrait?5:9;for(let i=0;i<panes;i++){const pw=W/panes;ctx.fillRect(i*pw+6,by+20,pw-12,bh-48);ctx.fillStyle='#a5d5d2';ctx.fillRect(i*pw+10,by+24,pw-20,bh-56);ctx.fillStyle='#41677a'}
 ctx.fillStyle='#263e50';ctx.fillRect(0,by+bh-15,W,15);ctx.fillStyle='#e4c997';ctx.fillRect(0,H*.79,W,H*.21);ctx.fillStyle='#f8e2b7';ctx.fillRect(0,H*.81,W,5);
 // runway and travel route lines
 ctx.strokeStyle='#fff2c5';ctx.lineWidth=3;ctx.setLineDash([18,17]);ctx.beginPath();ctx.moveTo(0,H*.88);ctx.lineTo(W,H*.88);ctx.stroke();ctx.setLineDash([]);
 // terminal sign
 ctx.fillStyle='#19334b';rr(W*.08,H*.12,W*.34,47,9);ctx.fill();ctx.fillStyle='#fff2d3';ctx.font='bold '+Math.max(14,W*.021)+'px system-ui';ctx.textAlign='center';ctx.fillText('INTERNATIONAL  ✈  DEPARTURES',W*.25,H*.12+30);
 // clouds
 ctx.fillStyle='#ffffff8c';for(let i=0;i<4;i++){const cx=((i*W*.31+W*.08)%(W+100));ctx.beginPath();ctx.ellipse(cx,H*.12,38,11,0,0,Math.PI*2);ctx.ellipse(cx+19,H*.105,21,13,0,0,Math.PI*2);ctx.fill()}
 // plane silhouette
 ctx.save();ctx.translate(W*.73,H*.19);ctx.rotate(-.08);ctx.fillStyle='#f7f5e9';ctx.beginPath();ctx.moveTo(-39,0);ctx.lineTo(-8,-5);ctx.lineTo(5,-22);ctx.lineTo(12,-22);ctx.lineTo(9,-5);ctx.lineTo(37,-2);ctx.lineTo(40,2);ctx.lineTo(8,4);ctx.lineTo(15,15);ctx.lineTo(9,15);ctx.lineTo(-5,4);ctx.lineTo(-37,4);ctx.closePath();ctx.fill();ctx.restore();
}
function drawCat(cx,cy){const actionSprite=catAction==='good'?goodCatSprite:catAction==='bad'?badCatSprite:catAction==='stunned'?stunnedCatSprite:catSprite;const activeSprite=actionSprite.complete&&actionSprite.naturalWidth?actionSprite:catSprite;if(activeSprite.complete&&activeSprite.naturalWidth){const w=166,h=w*activeSprite.naturalHeight/activeSprite.naturalWidth;ctx.save();ctx.shadowColor='#29213a66';ctx.shadowBlur=8;ctx.drawImage(activeSprite,cx-w/2,playerY()-h+5,w,h);ctx.restore();return}ctx.save();ctx.translate(cx-51,cy-40);ctx.fillStyle='#151c25';ctx.fillRect(14,28,65,31);ctx.fillRect(7,38,78,19);ctx.fillRect(23,56,16,12);ctx.fillRect(61,55,15,13);ctx.fillRect(7,54,20,9);ctx.fillRect(69,27,22,8);ctx.fillRect(84,31,12,7);ctx.fillRect(27,7,10,22);ctx.fillRect(58,6,11,22);ctx.fillRect(25,2,14,8);ctx.fillRect(56,2,15,8);ctx.fillRect(33,18,38,32);ctx.fillStyle='#dc8ea2';ctx.fillRect(30,6,6,13);ctx.fillRect(60,6,6,13);ctx.fillStyle='#f3e5c9';ctx.fillRect(43,30,5,5);ctx.fillRect(60,30,5,5);ctx.fillStyle='#b9f0df';ctx.fillRect(44,31,3,3);ctx.fillRect(61,31,3,3);ctx.fillStyle='#edb7aa';ctx.fillRect(53,38,5,4);ctx.fillStyle='#68717c';ctx.fillRect(38,48,28,4);ctx.restore()}
function drawIcon(d,x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#132b42e8';ctx.strokeStyle=d.color;ctx.lineWidth=2;rr(-50,-55,100,112,14);ctx.fill();ctx.stroke();const atlas=spriteAtlas.complete&&spriteAtlas.naturalWidth?spriteAtlas:spriteAtlasFast;if(atlas.complete&&atlas.naturalWidth){const n=itemsDef.indexOf(d),sx=(n%4)*200,sy=Math.floor(n/4)*200;ctx.shadowColor=d.color;ctx.shadowBlur=13;ctx.drawImage(atlas,sx,sy,200,200,-47,-52,94,94);ctx.shadowBlur=0}else{ctx.fillStyle=d.color;ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(d.tag.slice(0,10),0,-3)}ctx.fillStyle=d.color;ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(d.effect,0,50);ctx.restore()}
function draw(now,count=0){ctx.clearRect(0,0,W,H);bgDraw();ctx.fillStyle='#0d20302b';ctx.fillRect(0,0,W,H);if(state==='play'){ctx.fillStyle='#172d43dc';rr(13,13,112,36,10);ctx.fill();ctx.fillStyle='#ffe2a0';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('速度 Lv.'+(speedLevel+1),69,37);if(stun>0){ctx.fillStyle='#513745e8';rr(W-154,13,141,36,10);ctx.fill();ctx.fillStyle='#ffe0da';ctx.fillText('暫停 '+stun.toFixed(1)+' 秒',W-83,37)}}for(const it of falling)drawIcon(it.def,it.x,it.y);drawCat(x,playerY());for(const f of floaters){ctx.globalAlpha=f.life;ctx.fillStyle=f.color;ctx.strokeStyle='#173047';ctx.lineWidth=5;ctx.font='bold 28px system-ui';ctx.textAlign='center';const yy=f.y-(1-f.life)*34;ctx.strokeText(f.text,f.x,yy);ctx.fillText(f.text,f.x,yy);ctx.globalAlpha=1}if(state==='countdown'&&count){ctx.fillStyle='#0b1939aa';ctx.fillRect(0,0,W,H);ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 '+Math.round(Math.min(W,H)*.34)+'px system-ui';ctx.lineWidth=10;ctx.strokeStyle='#354b5c';ctx.shadowColor='#ffcf70';ctx.shadowBlur=28;ctx.fillStyle='#fff1b3';ctx.strokeText(String(count),W/2,H/2);ctx.fillText(String(count),W/2,H/2);ctx.restore()}}
function setLayout(){const ratio=Math.min(window.devicePixelRatio||1,3);const next=matchMedia('(max-width:700px) and (orientation:portrait)').matches;if(next===portrait&&canvas.width===Math.round(W*ratio)){loadBackdropForLayout();return;}const oldW=W,oldH=H;portrait=next;W=next?540:960;H=next?960:540;x=x/oldW*W;falling.forEach(it=>{it.x=it.x/oldW*W;it.y=it.y/oldH*H;it.speed=it.speed/oldH*H});target=null;canvas.width=Math.round(W*ratio);canvas.height=Math.round(H*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);loadBackdropForLayout();draw(performance.now())}addEventListener('resize',setLayout);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)ensureAudio()});function px(e){const r=canvas.getBoundingClientRect();return(e.clientX-r.left)/r.width*W}function py(e){const r=canvas.getBoundingClientRect();return(e.clientY-r.top)/r.height*H}canvas.addEventListener('touchend',()=>ensureAudio(true),{passive:true});canvas.addEventListener('pointerdown',e=>{ensureAudio();if(state!=='play'||stun>0||Math.abs(px(e)-x)>115||Math.abs(py(e)-playerY())>105)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);dragOffset=x-px(e);target=x;keyboard=0});canvas.addEventListener('pointermove',e=>{if(state==='play'&&stun<=0&&canvas.hasPointerCapture(e.pointerId)){e.preventDefault();target=px(e)+dragOffset}});canvas.addEventListener('pointerup',e=>{if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);target=null});canvas.addEventListener('pointercancel',()=>target=null);canvas.addEventListener('lostpointercapture',()=>target=null);
function setMoveDirection(direction){if(state!=='play'||stun>0)return;target=null;keyboard=direction}function releaseMoveDirection(direction){if(keyboard===direction)keyboard=0}function bindMoveButton(button,direction){button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);setMoveDirection(direction)});button.addEventListener('pointerup',e=>{e.preventDefault();releaseMoveDirection(direction)});button.addEventListener('pointercancel',()=>releaseMoveDirection(direction));button.addEventListener('lostpointercapture',()=>releaseMoveDirection(direction))}bindMoveButton(moveLeftButton,-1);bindMoveButton(moveRightButton,1);addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();setMoveDirection(-1)}else if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();setMoveDirection(1)}});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))releaseMoveDirection(-1);if(['ArrowRight','d','D'].includes(e.key))releaseMoveDirection(1)});addEventListener('blur',()=>{keyboard=0;target=null});
setLayout();draw(0);
